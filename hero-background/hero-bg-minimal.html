<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkHere Hero Background - Minimal</title>
    <style>
        /* ==============================================
           WORHERE HERO BACKGROUND - MINIMAL VERSION
           Just the background, no content overlay
           ============================================== */
        
        :root {
            --wh-blue: #1890ff;
            --wh-blue-light: #40a9ff;
            --center-accent: #ff3b8d;
            --center-accent-soft: #ff6bab;
            --bg-base: #f8f9fc;
            --bg-warm: #fff5f8;
            --intensity: 0.9;
            --speed: 1;
            --cycle-1: calc(28s / var(--speed));
            --cycle-2: calc(35s / var(--speed));
            --cycle-3: calc(22s / var(--speed));
            --cycle-4: calc(40s / var(--speed));
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .wh-hero-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: var(--bg-base);
        }
        
        .wh-hero-bg__base {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 120% 80% at 50% 50%, var(--bg-warm) 0%, transparent 70%),
                linear-gradient(180deg, #ffffff 0%, var(--bg-base) 50%, #f0f4f8 100%);
        }
        
        .wh-hero-bg__center {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 65% 55% at 50% 45%, 
                rgba(255, 59, 141, calc(0.3 * var(--intensity))) 0%,
                rgba(255, 107, 171, calc(0.15 * var(--intensity))) 35%,
                transparent 70%
            );
        }
        
        .wh-hero-bg__edges {
            position: absolute;
            inset: 0;
        }
        
        .wh-hero-bg__edges::before {
            content: '';
            position: absolute;
            width: 50%;
            height: 60%;
            top: -20%;
            left: -10%;
            background: radial-gradient(ellipse at center, var(--wh-blue) 0%, transparent 70%);
            filter: blur(80px);
            opacity: calc(0.2 * var(--intensity));
        }
        
        .wh-hero-bg__edges::after {
            content: '';
            position: absolute;
            width: 55%;
            height: 60%;
            bottom: -25%;
            right: -15%;
            background: radial-gradient(ellipse at center, var(--wh-blue-light) 0%, transparent 70%);
            filter: blur(80px);
            opacity: calc(0.18 * var(--intensity));
        }
        
        .wh-hero-bg__blobs {
            position: absolute;
            inset: -15%;
            filter: blur(50px);
        }
        
        .wh-hero-bg__blob {
            position: absolute;
            border-radius: 50%;
            will-change: transform;
        }
        
        .wh-hero-bg__blob--1 {
            width: 40%;
            height: 45%;
            top: 22%;
            left: 20%;
            background: radial-gradient(ellipse at 40% 40%, 
                rgba(255, 59, 141, calc(0.35 * var(--intensity))) 0%,
                rgba(255, 107, 171, calc(0.15 * var(--intensity))) 50%,
                transparent 70%
            );
            animation: drift1 var(--cycle-1) ease-in-out infinite;
        }
        
        .wh-hero-bg__blob--2 {
            width: 35%;
            height: 40%;
            top: 28%;
            right: 18%;
            background: radial-gradient(ellipse at 60% 50%, 
                rgba(255, 107, 171, calc(0.28 * var(--intensity))) 0%,
                transparent 60%
            );
            animation: drift2 var(--cycle-2) ease-in-out infinite;
        }
        
        .wh-hero-bg__blob--3 {
            width: 30%;
            height: 35%;
            top: 0%;
            left: 8%;
            background: radial-gradient(ellipse at 30% 60%, 
                rgba(24, 144, 255, calc(0.2 * var(--intensity))) 0%,
                transparent 60%
            );
            animation: drift3 var(--cycle-3) ease-in-out infinite;
        }
        
        .wh-hero-bg__blob--4 {
            width: 38%;
            height: 45%;
            bottom: 8%;
            right: 5%;
            background: radial-gradient(ellipse at 70% 40%, 
                rgba(64, 169, 255, calc(0.18 * var(--intensity))) 0%,
                transparent 55%
            );
            animation: drift4 var(--cycle-4) ease-in-out infinite;
        }
        
        .wh-hero-bg__grain {
            position: absolute;
            inset: 0;
            opacity: 0.035;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }
        
        @keyframes drift1 {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(3%, -2%) scale(1.02) rotate(1deg); }
            50% { transform: translate(-2%, 3%) scale(0.98) rotate(-1deg); }
            75% { transform: translate(-3%, -1%) scale(1.01) rotate(0.5deg); }
        }
        
        @keyframes drift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-4%, 2%) scale(1.03); }
            66% { transform: translate(2%, -3%) scale(0.97); }
        }
        
        @keyframes drift3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(5%, 4%) rotate(2deg); }
        }
        
        @keyframes drift4 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            40% { transform: translate(-3%, -2%) scale(1.04); }
            80% { transform: translate(2%, 3%) scale(0.96); }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .wh-hero-bg__blob { animation: none !important; }
        }
        
        /* Demo content */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .logo {
            display: flex;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        
        .logo-work {
            background: var(--wh-blue);
            color: white;
            padding: 0.2em 0.4em;
            border-radius: 0.15em;
        }
        
        .logo-here {
            color: #1a1a2e;
            padding: 0.2em 0.4em;
        }
        
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #1a1a2e;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.2rem;
            color: #4a5568;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="wh-hero-bg">
        <div class="wh-hero-bg__base"></div>
        <div class="wh-hero-bg__center"></div>
        <div class="wh-hero-bg__edges"></div>
        <div class="wh-hero-bg__blobs">
            <div class="wh-hero-bg__blob wh-hero-bg__blob--1"></div>
            <div class="wh-hero-bg__blob wh-hero-bg__blob--2"></div>
            <div class="wh-hero-bg__blob wh-hero-bg__blob--3"></div>
            <div class="wh-hero-bg__blob wh-hero-bg__blob--4"></div>
        </div>
        <div class="wh-hero-bg__grain"></div>
    </div>
    
    <div class="content">
        <div class="logo">
            <span class="logo-work">Work</span>
            <span class="logo-here">Here</span>
        </div>
        <h1>ИИ-поиск кандидатов</h1>
        <p>Интеллектуальный поиск по базе и работным сайтам</p>
    </div>
</body>
</html>
