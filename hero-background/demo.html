<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkHere AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            overflow: hidden;
        }
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 500px;
            background: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero__canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        .hero__content {
            position: relative;
            z-index: 20;
            text-align: center;
            padding: 40px;
            max-width: 650px;
        }
        .hero__title {
            font-size: 3rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 24px;
            line-height: 1.15;
        }
        .hero__text {
            font-size: 1.2rem;
            color: #555;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <section class="hero">
        <canvas class="hero__canvas" id="canvas"></canvas>
        <div class="hero__content">
            <h1 class="hero__title">WorkHere AI</h1>
            <p class="hero__text">
                Искусственный интеллект WorkHere AI непрерывно анализирует вашу работу над вакансией и рекомендует подходящих кандидатов из вашей базы
            </p>
        </div>
    </section>

    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H, time = 0;
    
    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    
    // Simplex noise
    class Noise {
        constructor() {
            this.p = [];
            for (let i = 0; i < 256; i++) this.p[i] = Math.floor(Math.random() * 256);
            this.p = this.p.concat(this.p);
        }
        
        fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        lerp(t, a, b) { return a + t * (b - a); }
        grad(hash, x, y) {
            const h = hash & 3;
            const u = h < 2 ? x : y;
            const v = h < 2 ? y : x;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }
        
        noise2d(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            const u = this.fade(x);
            const v = this.fade(y);
            const A = this.p[X] + Y;
            const B = this.p[X + 1] + Y;
            return this.lerp(v,
                this.lerp(u, this.grad(this.p[A], x, y), this.grad(this.p[B], x - 1, y)),
                this.lerp(u, this.grad(this.p[A + 1], x, y - 1), this.grad(this.p[B + 1], x - 1, y - 1))
            );
        }
    }
    
    const noise = new Noise();
    
    // Color
    const baseColor = { r: 227, g: 113, b: 27 }; // #E3711B
    
    // Organic shape definitions
    const shapes = [
        // LEFT - Main large shape
        {
            side: 'left',
            getPath: (t) => {
                const pts = [];
                const baseX = -0.15;
                const wobble = (i) => noise.noise2d(i * 0.3, t * 0.5) * 0.08;
                
                pts.push({ x: baseX - 0.1, y: -0.1 });
                pts.push({ x: baseX + 0.25 + wobble(0), y: 0.1 + wobble(1) });
                pts.push({ x: baseX + 0.35 + wobble(2), y: 0.3 + wobble(3) });
                pts.push({ x: baseX + 0.30 + wobble(4), y: 0.5 + wobble(5) });
                pts.push({ x: baseX + 0.38 + wobble(6), y: 0.7 + wobble(7) });
                pts.push({ x: baseX + 0.25 + wobble(8), y: 0.9 + wobble(9) });
                pts.push({ x: baseX - 0.1, y: 1.1 });
                pts.push({ x: baseX - 0.3, y: 0.8 });
                pts.push({ x: baseX - 0.2, y: 0.5 });
                pts.push({ x: baseX - 0.25, y: 0.2 });
                
                return pts;
            }
        },
        // LEFT - Secondary shape
        {
            side: 'left',
            getPath: (t) => {
                const pts = [];
                const baseX = 0.05;
                const wobble = (i) => noise.noise2d(i * 0.3 + 10, t * 0.4) * 0.06;
                
                pts.push({ x: baseX - 0.15, y: 0.2 });
                pts.push({ x: baseX + 0.15 + wobble(0), y: 0.25 + wobble(1) });
                pts.push({ x: baseX + 0.22 + wobble(2), y: 0.45 + wobble(3) });
                pts.push({ x: baseX + 0.18 + wobble(4), y: 0.65 + wobble(5) });
                pts.push({ x: baseX + 0.08 + wobble(6), y: 0.85 + wobble(7) });
                pts.push({ x: baseX - 0.1, y: 0.95 });
                pts.push({ x: baseX - 0.2, y: 0.7 });
                pts.push({ x: baseX - 0.18, y: 0.45 });
                
                return pts;
            }
        },
        // RIGHT - Main large shape
        {
            side: 'right',
            getPath: (t) => {
                const pts = [];
                const baseX = 1.15;
                const wobble = (i) => noise.noise2d(i * 0.3 + 20, t * 0.5) * 0.08;
                
                pts.push({ x: baseX + 0.1, y: -0.1 });
                pts.push({ x: baseX - 0.25 + wobble(0), y: 0.1 + wobble(1) });
                pts.push({ x: baseX - 0.35 + wobble(2), y: 0.3 + wobble(3) });
                pts.push({ x: baseX - 0.30 + wobble(4), y: 0.5 + wobble(5) });
                pts.push({ x: baseX - 0.38 + wobble(6), y: 0.7 + wobble(7) });
                pts.push({ x: baseX - 0.25 + wobble(8), y: 0.9 + wobble(9) });
                pts.push({ x: baseX + 0.1, y: 1.1 });
                pts.push({ x: baseX + 0.3, y: 0.8 });
                pts.push({ x: baseX + 0.2, y: 0.5 });
                pts.push({ x: baseX + 0.25, y: 0.2 });
                
                return pts;
            }
        },
        // RIGHT - Secondary shape
        {
            side: 'right',
            getPath: (t) => {
                const pts = [];
                const baseX = 0.95;
                const wobble = (i) => noise.noise2d(i * 0.3 + 30, t * 0.4) * 0.06;
                
                pts.push({ x: baseX + 0.15, y: 0.15 });
                pts.push({ x: baseX - 0.12 + wobble(0), y: 0.2 + wobble(1) });
                pts.push({ x: baseX - 0.20 + wobble(2), y: 0.4 + wobble(3) });
                pts.push({ x: baseX - 0.18 + wobble(4), y: 0.6 + wobble(5) });
                pts.push({ x: baseX - 0.10 + wobble(6), y: 0.8 + wobble(7) });
                pts.push({ x: baseX + 0.1, y: 0.9 });
                pts.push({ x: baseX + 0.2, y: 0.65 });
                pts.push({ x: baseX + 0.18, y: 0.4 });
                
                return pts;
            }
        }
    ];
    
    function drawShape(shape, t) {
        const path = shape.getPath(t);
        
        // Convert to screen coords
        const screenPath = path.map(p => ({
            x: p.x * W,
            y: p.y * H
        }));
        
        // Create smooth bezier path
        ctx.save();
        ctx.beginPath();
        
        // Draw smooth curve through points
        ctx.moveTo(screenPath[0].x, screenPath[0].y);
        for (let i = 0; i < screenPath.length; i++) {
            const p0 = screenPath[(i - 1 + screenPath.length) % screenPath.length];
            const p1 = screenPath[i];
            const p2 = screenPath[(i + 1) % screenPath.length];
            const p3 = screenPath[(i + 2) % screenPath.length];
            
            const cp1x = p1.x + (p2.x - p0.x) * 0.2;
            const cp1y = p1.y + (p2.y - p0.y) * 0.2;
            const cp2x = p2.x - (p3.x - p1.x) * 0.2;
            const cp2y = p2.y - (p3.y - p1.y) * 0.2;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
        }
        ctx.closePath();
        
        // Clip to shape
        ctx.clip();
        
        // Draw flowing waves INSIDE the shape
        drawInternalWaves(screenPath, t, shape.side);
        
        ctx.restore();
    }
    
    function drawInternalWaves(path, t, side) {
        // Get bounding box
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const p of path) {
            minX = Math.min(minX, p.x);
            maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y);
            maxY = Math.max(maxY, p.y);
        }
        
        const width = maxX - minX;
        const height = maxY - minY;
        
        // Direction of flow
        const flowDir = side === 'left' ? 1 : -1;
        
        // Number of wave stripes
        const stripeCount = 25;
        
        // Draw each wave stripe
        for (let i = 0; i < stripeCount; i++) {
            const ratio = i / stripeCount;
            
            // Base position along the shape
            const flowOffset = (t * 0.8 * flowDir + ratio * 3) % 3 - 1;
            
            // Wave parameters
            const waveAmp = 15 + noise.noise2d(i * 0.5, t * 0.3) * 20;
            const waveFreq = 0.015 + noise.noise2d(i * 0.3 + 5, t * 0.2) * 0.008;
            const phaseOffset = noise.noise2d(i * 0.7, t * 0.1) * Math.PI * 2;
            
            // Color variation - darker in valleys, lighter on peaks
            const colorPhase = Math.sin(ratio * Math.PI * 4 + t * 2 + phaseOffset);
            const brightness = 0.7 + colorPhase * 0.3;
            const alpha = 0.6 + colorPhase * 0.3;
            
            const r = Math.min(255, baseColor.r * brightness + (1 - brightness) * 255);
            const g = Math.min(255, baseColor.g * brightness + (1 - brightness) * 220);
            const b = Math.min(255, baseColor.b * brightness + (1 - brightness) * 200);
            
            // Draw wave stripe
            ctx.beginPath();
            
            const segments = 80;
            for (let j = 0; j <= segments; j++) {
                const segRatio = j / segments;
                
                // Position along the shape (vertical for this orientation)
                let x, y;
                
                if (side === 'left') {
                    // Waves flow from top-left to bottom
                    const baseY = minY + segRatio * height;
                    const baseX = minX + (ratio + flowOffset) * width * 0.5;
                    
                    // Add wave distortion
                    const wave1 = Math.sin(segRatio * Math.PI * 6 + t * 3 + phaseOffset) * waveAmp;
                    const wave2 = Math.sin(segRatio * Math.PI * 10 + t * 2 + phaseOffset * 1.5) * waveAmp * 0.4;
                    const noiseOffset = noise.noise2d(segRatio * 3, t * 0.5 + i * 0.2) * waveAmp * 0.6;
                    
                    x = baseX + wave1 + wave2 + noiseOffset;
                    y = baseY;
                } else {
                    // Right side - mirror
                    const baseY = minY + segRatio * height;
                    const baseX = maxX - (ratio + flowOffset) * width * 0.5;
                    
                    const wave1 = Math.sin(segRatio * Math.PI * 6 + t * 3 + phaseOffset) * waveAmp;
                    const wave2 = Math.sin(segRatio * Math.PI * 10 + t * 2 + phaseOffset * 1.5) * waveAmp * 0.4;
                    const noiseOffset = noise.noise2d(segRatio * 3, t * 0.5 + i * 0.2) * waveAmp * 0.6;
                    
                    x = baseX - wave1 - wave2 - noiseOffset;
                    y = baseY;
                }
                
                if (j === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            // Varying stroke width for depth
            const strokeWidth = 8 + Math.sin(ratio * Math.PI * 2 + t) * 6;
            
            ctx.strokeStyle = `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${alpha})`;
            ctx.lineWidth = strokeWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }
        
        // Add highlight streaks
        for (let i = 0; i < 8; i++) {
            const ratio = (i / 8 + t * 0.3) % 1;
            const highlightY = minY + ratio * height;
            
            const wave = Math.sin(ratio * Math.PI * 4 + t * 2) * 30;
            const highlightX = side === 'left' 
                ? minX + width * 0.3 + wave
                : maxX - width * 0.3 - wave;
            
            const grad = ctx.createRadialGradient(highlightX, highlightY, 0, highlightX, highlightY, 40);
            grad.addColorStop(0, `rgba(255, 255, 255, ${0.4 + Math.sin(t * 3 + i) * 0.2})`);
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = grad;
            ctx.fillRect(highlightX - 40, highlightY - 40, 80, 80);
        }
    }
    
    function draw() {
        time += 0.016;
        
        // Clear
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, H);
        
        // Draw each organic shape with internal waves
        for (const shape of shapes) {
            drawShape(shape, time);
        }
        
        // Soft white center for text readability
        const centerGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W, H) * 0.45);
        centerGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        centerGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.9)');
        centerGrad.addColorStop(0.7, 'rgba(255, 255, 255, 0.4)');
        centerGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = centerGrad;
        ctx.fillRect(0, 0, W, H);
        
        requestAnimationFrame(draw);
    }
    
    draw();
    </script>
</body>
</html>
